upstream tnaflex_webapp {
    server 192.168.122.102:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    server_name tnaflex.cletusigwe.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

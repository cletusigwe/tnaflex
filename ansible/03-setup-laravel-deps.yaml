- name: Install packages like git, composer and bun
  hosts:
    - webapp-node
    - video-preprocessor-node
  become: true
  gather_facts: false
  serial: 1

  vars:
    deploy_user: ubuntu
    deploy_home: /home/ubuntu
    php_version: "8.5"
    bun_executable: /home/ubuntu/.bun/bin/bun

  tasks:
    - name: Install PHP repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add PHP repository
      ansible.builtin.deb822_repository:
        name: ondrej-php
        types:
          - deb
        uris:
          - https://ppa.launchpadcontent.net/ondrej/php/ubuntu
        suites:
          - noble
        components:
          - main
        signed_by: >-
          https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xB8DC7E53946656EFBCE4C1DD71DAEAAB4AD4CAB6
        state: present

    - name: Refresh package index after adding PHP repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install PHP, Composer and supporting packages
      ansible.builtin.apt:
        name:
          - git
          - curl
          - unzip
          - composer
          - "php{{ php_version }}-cli"
          - "php{{ php_version }}-curl"
          - "php{{ php_version }}-mbstring"
          - "php{{ php_version }}-mysql"
          - "php{{ php_version }}-xml"
          - "php{{ php_version }}-zip"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Select PHP 8.5 as the default CLI
      community.general.alternatives:
        name: php
        path: "/usr/bin/php{{ php_version }}"

    - name: Install Nginx and PHP-FPM on webapp-node
      ansible.builtin.apt:
        name:
          - nginx
          - "php{{ php_version }}-fpm"
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: inventory_hostname == "webapp-node"

    - name: Install ffmpeg on video-preprocessor node
      ansible.builtin.apt:
        name:
          - ffmpeg
        state: present
      when: inventory_hostname == "video-preprocessor-node"

    - name: Download Bun installer
      ansible.builtin.get_url:
        url: https://bun.com/install
        dest: /tmp/install-bun.sh
        mode: "0755"

    - name: Install Bun
      become_user: "{{ deploy_user }}"
      ansible.builtin.command:
        argv:
          - bash
          - /tmp/install-bun.sh
        creates: "{{ bun_executable }}"
      environment:
        HOME: "{{ deploy_home }}"
        BUN_INSTALL: "{{ deploy_home }}/.bun"
